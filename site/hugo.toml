baseURL = "https://woo.dasopen.nl/"
locale = "nl-NL"
defaultContentLanguage = "nl"
title = "Woo als een pro"
enableRobotsTXT = true
pluralizeListTitles = false

[params]
  # Target for links to files that are not on the site.
  repoURL = "https://github.com/sjev/woo-als-een-pro"

[params.theme]
  displayToggle = false

[params.footer]
  displayPoweredBy = false

[menus]
  [[menus.main]]
    name = "Kennisbank"
    pageRef = "/docs"
    weight = 10
  [[menus.main]]
    name = "Sjablonen"
    pageRef = "/templates"
    weight = 20
  [[menus.main]]
    name = "Uitspraken"
    pageRef = "/uitspraken"
    weight = 30
  [[menus.main]]
    name = "Zoeken"
    weight = 40
    [menus.main.params]
      type = "search"
  [[menus.main]]
    name = "Thema"
    weight = 50
    [menus.main.params]
      type = "theme-toggle"
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/sjev/woo-als-een-pro"
    weight = 60
    [menus.main.params]
      icon = "github"

# The repo holds the content, so GitHub and the site read the same files.
# README.md is the folder page on GitHub and becomes _index.md here.
# site/content holds the pages that only the site needs (home, Kennisbank index).
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
  [[module.mounts]]
    source = "../templates"
    target = "content/templates"
    files = ["! README.md"]
  [[module.mounts]]
    source = "../templates/README.md"
    target = "content/templates/_index.md"
  [[module.mounts]]
    source = "../uitspraken"
    target = "content/uitspraken"
    files = ["! README.md"]
  [[module.mounts]]
    source = "../uitspraken/README.md"
    target = "content/uitspraken/_index.md"
  # Only the law articles that the docs link to. `inv laws` fills this folder.
  [[module.mounts]]
    source = "wetten"
    target = "content/wetten"

# Rulings carry their date as `datum`; the sidebar then lists them by date.
[frontmatter]
  date = ["date", "datum"]

[markup.goldmark.renderer]
  unsafe = true

# One sidebar tree for the whole site: Hextra starts it at the home page when that is a docs page.
[[cascade]]
  type = "docs"

# The READMEs have no front matter, so the site sets their title and order here.
[[cascade]]
  title = "Sjablonen"
  weight = 2
  [cascade.target]
    path = "/templates"

[[cascade]]
  title = "Uitspraken"
  weight = 3
  [cascade.target]
    path = "/uitspraken"

# Readers reach law articles and full rulings through links, not through the sidebar.
[[cascade]]
  [cascade.params.sidebar]
    exclude = true
  [cascade.target]
    path = "{/wetten,/wetten/**,/uitspraken/tekst/**}"
